name: Build e Teste Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Analise Testes e APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versoes
        run: |
          flutter --version
          dart --version

      - name: Garante scaffolding Android
        run: |
          flutter create --platforms=android --org com.iptvstreamer --project-name iptv_streamer . || true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formatacao
        run: |
          dart format --output=none --set-exit-if-changed . || echo "AVISO - formatacao pendente (nao bloqueia o build)"

      - name: Analise estatica
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Executar testes
        run: flutter test

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Build APK release
        run: flutter build apk --release

      - name: Build AAB release
        run: flutter build appbundle

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
